<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chef Sous App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="images/sc.png" type="image/png">
  <link rel="icon" href="images/sc.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>

<body>
<script>
  const CONFIG = {
    comingSoon: true // set to false to enable full site
  };
</script>

<!-- HERO (Parallax) -->
<section class="parallax hero">
  <div class="content">
    <img src="images/sc.png" alt="Chef Sous Logo" class="logo">
    <h1>Chef Sous</h1>
    <p id="heroSubtitle">The joy of cooking</p>
    <p id="comingSoonText" style="display:none;">Coming soon</p>
    <a href="#" class="appstore-btn" id="downloadBtn"><img src="images/download.svg" alt="Download"></a>
  </div>
</section>

<div id="featuresSection"><!-- FEATURES -->
<section class="section features" data-aos="fade-up">
  <div class="features-content">
    <h2>Your recipes, your way</h2>
    <p>Plan meals, manage recipes, and cook smiling.</p>
  </div>

  <img src="images/pretzel.png" alt="" class="features-bg-image">
</section>
</div>

<!-- PARALLAX BREAK -->
<section class="parallax mid"></section>

<div id="carouselSection"><!-- SCREENSHOT CAROUSEL -->
<section class="section" data-aos="fade-up">
  <h2>at your fingertips</h2>

  <div class="carousel">
    <button class="nav prev">&#10094;</button>

    <div class="carousel-track">
      <div class="phone">
        <img src="images/app-previews/preview1.png" alt="App preview 1">
      </div>
      <div class="phone">
        <img src="images/app-previews/preview2.png" alt="App preview 2">
      </div>
      <div class="phone">
        <img src="images/app-previews/preview3.png" alt="App preview 3">
      </div>
      <div class="phone">
        <img src="images/app-previews/preview4.png" alt="App preview 4">
      </div>
    </div>

    <button class="nav next">&#10095;</button>
  </div>
</section>
</div>

<!-- CTA -->
<section class="parallax footer">
  <div class="content">
    <h2>"What's for dinner?"</h2>
    <a href="#" class="appstore-btn" id="downloadBtnFooter"><img src="images/download.svg" alt="Download"></a>
  </div>
</section>

<section class="madeby-section">
  <div class="madeby-note">
    <div class="madeby-item">
      <p>Proudly made by</p>
      <img src="images/family.png" alt="Australian family" class="madeby-img">
    </div>
    <div class="madeby-item">
      <a href="mailto:contact@chefsous.app" class="footer-link">Contact us<img src="images/contact.png" alt="Email" class="email-icon"></a>
    </div>
    <div class="madeby-item">
      <a href="terms.html" class="footer-link">Terms and Conditions</a>
    </div>
    <div class="madeby-item">
      <a href="privacy.html" class="footer-link">Privacy Policy</a>
    </div>
  </div>
</section>

<script src="script.js"></script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({
    duration: 900,
    easing: 'ease-in-out',
    once: false,
    mirror: true
  });
</script>

<script>
  if (CONFIG.comingSoon) {
    // Hide download buttons
    document.getElementById("downloadBtn")?.style.setProperty("display", "none");
    document.getElementById("downloadBtnFooter")?.style.setProperty("display", "none");

    // Hide sections
    document.getElementById("featuresSection")?.style.setProperty("display", "none");
    document.getElementById("carouselSection")?.style.setProperty("display", "none");

    // Show "Coming Soon"
    document.getElementById("heroSubtitle")?.style.setProperty("display", "none");
    document.getElementById("comingSoonText")?.style.setProperty("display", "block");
  }
</script>

</body>
</html>
